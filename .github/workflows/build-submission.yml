name: Export and verify assessed PDF documents

on:
  push:
    branches: [feature/space-first-catalogue]
    paths:
      - 'docs/**'
      - 'scripts/build_submission_docs.py'
      - 'scripts/validate_submission.py'
      - '.github/workflows/build-submission.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/build_submission_docs.py'
      - 'scripts/validate_submission.py'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF build dependencies
        run: python -m pip install 'reportlab>=4,<5' 'pypdf>=5,<7' 'Pillow>=10,<13'
      - name: Build six PDFs from source files and exported UML diagrams
        run: python scripts/build_submission_docs.py
      - name: Validate all required submission artifacts
        run: python scripts/validate_submission.py
      - name: Publish PDF exports onto the final docs branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/space-first-catalogue'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/submission/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: export assessed submission PDFs from checked sources"
            git push
          fi
