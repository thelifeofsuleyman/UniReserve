.5,514.4531,727.5,518.4531,717.5,522.4531,721.5,518.4531" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="498.5" x2="723.5" y1="518.4531" y2="518.4531"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="59" x="505.5" y="513.3872">commit()</text><polygon fill="#A80036" points="92.5,543.5859,82.5,547.5859,92.5,551.5859,88.5,547.5859" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="86.5" x2="497.5" y1="547.5859" y2="547.5859"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="115" x="98.5" y="542.52">change confirmed</text><path d="M26,574.5859 L26,614.5859 L554,614.5859 L554,584.5859 L544,574.5859 L26,574.5859 " fill="#FBFB77" filter="url(#f7la975snrf25)" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M544,574.5859 L544,584.5859 L554,584.5859 L544,574.5859 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="199" x="110" y="591.6528">Disabling blocks NEW requests.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="347" x="110" y="606.7856">It does not silently cancel existing confirmed bookings.</text><!--MD5=[6407e49c20164539e2d340c08f7f365d]
@startuml
title UC-06 - Admin maintains catalogue
actor "Administrator" as A
participant "AdminRoutes" as R
participant "ResourceService" as S
participant "SQLiteUnitOfWork" as T
database "ResourceRepository" as Repo
A -> R : create/edit/disable(resource)
R -> S : change_resource(user, data)
S -> S : require ADMIN role
alt non-admin actor
  S - -> A : forbidden; no changes
else authorized actor
  S -> S : check required fields, unique code
  alt duplicate code or invalid input
    S - -> A : validation error
  else valid change
    S -> T : BEGIN IMMEDIATE
    S -> Repo : save resource change
    Repo - -> S : saved
    S -> T : commit()
    S - -> A : change confirmed
  end
end
note over A,S
  Disabling blocks NEW requests.
  It does not silently cancel existing confirmed bookings.
end note
@enduml

